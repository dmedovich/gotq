name: Nightly hardening

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-hardening
  cancel-in-progress: true

jobs:
  fuzz:
    name: extended fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzFilterLexer, FuzzFilterParser, FuzzQueryPipeline, FuzzRelationshipPipeline, FuzzCursorPipeline]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go.sum
      - name: Run extended fuzz target
        run: go test -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime=5m -parallel=2

  benchmark:
    name: benchmark evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go.sum
      - name: Run benchmarks
        run: go test -run='^$' -bench=. -benchmem -count=5 ./... | tee benchmarks.txt
      - uses: actions/upload-artifact@v7
        with:
          name: nightly-benchmarks
          path: benchmarks.txt
          retention-days: 30
